<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive Strategy Similarity Violins</title>
  <style>
    :root {
      --correct: #06438A;
      --incorrect: #BE4E0C;
      --wrong-correct: #042968;
      --correct-wrong: #690719;
      --same: #CEC9C9;
      --grid: #e6e3e3;
      --ink: #111827;
      --muted: #687386;
    }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: #f5f7fb;
    }
    header {
      padding: 24px 32px 12px;
      background: white;
      border-bottom: 1px solid #e2e6ef;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }
    .subtle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }
    main {
      padding: 24px 32px 44px;
    }
    .chart-card {
      background: white;
      border: 1px solid #dfe4ee;
      border-radius: 8px;
      margin: 0 0 28px;
      padding: 18px 22px 24px;
      box-shadow: 0 2px 10px rgba(20, 32, 54, 0.05);
    }
    .chart-title {
      margin: 0 0 14px;
      font-size: 22px;
    }
    .legend {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 16px 20px;
      padding: 8px 12px;
      border: 1px solid #666666;
      border-radius: 5px;
      background: white;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }
    .swatch {
      width: 18px;
      height: 10px;
      border-radius: 2px;
      display: inline-block;
    }
    .line-swatch {
      width: 28px;
      height: 0;
      border-top: 3px solid currentColor;
      display: inline-block;
    }
    .plot-wrap {
      position: relative;
      overflow-x: auto;
    }
    svg {
      display: block;
      width: min(100%, 1200px);
      min-width: 980px;
      margin: 0 auto;
      height: auto;
      background: white;
    }
    .axis text,
    .tick-label {
      fill: #222;
      font-size: 21px;
    }
    .axis-label {
      fill: #111;
      font-size: 23px;
      font-weight: 600;
    }
    .grid-line {
      stroke: var(--grid);
      stroke-width: 1.2;
    }
    .axis-line {
      stroke: #333333;
      stroke-width: 1.8;
    }
    .violin {
      fill-opacity: 0;
      stroke-opacity: 1;
      stroke-width: 3;
    }
    .median {
      stroke: #111111;
      stroke-width: 4;
      stroke-linecap: round;
      pointer-events: none;
    }
    .sample-line {
      fill: none;
      stroke-width: 1;
      opacity: 0.42;
      pointer-events: none;
    }
    .sample-line.same { stroke: var(--same); opacity: 0.36; }
    .sample-line.wrong-correct { stroke: var(--wrong-correct); opacity: 0.66; }
    .sample-line.correct-wrong { stroke: var(--correct-wrong); opacity: 0.66; }
    .point {
      cursor: pointer;
      stroke: none;
      opacity: 0.75;
      transition: opacity 120ms ease, r 120ms ease;
    }
    .point.correct { fill: var(--correct); }
    .point.incorrect { fill: var(--incorrect); }
    .point.dimmed { opacity: 0.08; }
    .point.active { opacity: 1; r: 7; }
    .sample-line.dimmed { opacity: 0.04; }
    .sample-line.active { opacity: 0.95; stroke-width: 2.4; }
    .hover-label {
      fill: #111827;
      font-size: 17px;
      font-weight: 700;
      paint-order: stroke;
      stroke: white;
      stroke-width: 4px;
      stroke-linejoin: round;
      pointer-events: none;
    }
    .tooltip {
      position: fixed;
      z-index: 10;
      display: none;
      background: rgba(18, 24, 38, 0.94);
      color: white;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.35;
      pointer-events: none;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
    }
    .hint {
      color: var(--muted);
      font-size: 13px;
      margin: 8px 0 0;
    }
  </style>
</head>

ategy": 3, "score": 0.6316486110289892, "correct": true, "sampleKey": "64-2", "moleculeId": 64, "experimentId": 2, "chemicalDescription": "L-Guanosine", "expectedResult": "Gel", "pngStyleJitter": 1.468670432253873, "detailUrl": "details/grok-4.3__m064_e002.html"}]}</script>
  <script>
    const DATA = JSON.parse(document.getElementById('plot-data').textContent);
    const app = document.getElementById('app');
    const tooltip = document.getElementById('tooltip');

    const width = 1800;
    const height = 1120;
    const margin = { top: 140, right: 120, bottom: 230, left: 260 };
    const plotWidth = width - margin.left - margin.right;
    const plotHeight = height - margin.top - margin.bottom;
    const xMin = DATA.xMin;
    const xMax = DATA.xMax;
    const strategies = DATA.strategies;
    const colors = {
      correct: '#06438A',
      incorrect: '#BE4E0C',
      wrongCorrect: '#042968',
      correctWrong: '#690719',
      same: '#CEC9C9',
    };

    function makeSvg(tag, attrs = {}) {
      const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
      for (const [key, value] of Object.entries(attrs)) el.setAttribute(key, value);
      return el;
    }

    function xScale(value) {
      return margin.left + (value - xMin) / (xMax - xMin) * plotWidth;
    }

    function yScale(strategyValue) {
      return margin.top + (strategyValue - -0.5) / (3.5 - -0.5) * plotHeight;
    }

    function mean(values) {
      return values.reduce((sum, value) => sum + value, 0) / values.length;
    }

    function tickValues() {
      const ticks = [];
      const step = (xMax - xMin) > 2 ? 1 : 0.1;
      const start = Math.ceil((xMin - 1e-9) / step) * step;
      for (let value = start; value <= xMax + 1e-9; value += step) {
        ticks.push(Number(value.toFixed(2)));
      }
      return ticks;
    }

    function classifySegment(start, end) {
      if (!start.correct && end.correct) return 'wrong-correct';
      if (start.correct && !end.correct) return 'correct-wrong';
      return 'same';
    }

    function buildDensity(values, xMin, xMax) {
      const binCount = 90;
      const counts = Array(binCount).fill(0);
      const step = (xMax - xMin) / binCount;
      for (const value of values) {
        const index = Math.max(0, Math.min(binCount - 1, Math.floor((value - xMin) / step)));
        counts[index] += 1;
      }
      const kernel = [];
      for (let i = -8; i <= 8; i++) kernel.push(Math.exp(-0.5 * Math.pow(i / 3, 2)));
      const kernelSum = kernel.reduce((sum, value) => sum + value, 0);
      for (let i = 0; i < kernel.length; i++) kernel[i] /= kernelSum;
      const smooth = counts.map((_, index) => {
        let sum = 0;
        for (let k = 0; k < kernel.length; k++) {
          const source = index + k - 8;
          if (source >= 0 && source < counts.length) sum += counts[source] * kernel[k];
        }
        return sum;
      });
      const maxDensity = Math.max(...smooth, 1e-9);
      return smooth.map((density, index) => ({
        x: xMin + (index + 0.5) * step,
        width: density / maxDensity * DATA.violinHalfWidth,
      }));
    }

    function renderChart(model) {
      const card = document.createElement('section');
      card.className = 'chart-card';
      card.innerHTML = `
        <h2 class="chart-title">${DATA.modelLabels[model] || model}</h2>
        <div class="legend">
          <span class="legend-item"><span class="swatch" style="background:${colors.correct}"></span>Correct prediction</span>
          <span class="legend-item"><span class="swatch" style="background:${colors.incorrect}"></span>Wrong prediction</span>
          <span class="legend-item"><span class="line-swatch" style="color:#111111"></span>Mean</span>
          <span class="legend-item"><span class="line-swatch" style="color:${colors.wrongCorrect}"></span>Wrong to correct</span>
          <span class="legend-item"><span class="line-swatch" style="color:${colors.correctWrong}"></span>Correct to wrong</span>
          <span class="legend-item"><span class="line-swatch" style="color:${colors.same}"></span>Same correctness</span>
        </div>
        <div class="plot-wrap"></div>
        <p class="hint">Hover to highlight one molecule-experiment trajectory. Click any point to open its detail page.</p>
      `;
      const svg = makeSvg('svg', { viewBox: `0 0 ${width} ${height}`, role: 'img' });
      card.querySelector('.plot-wrap').appendChild(svg);
      app.appendChild(card);

      const modelPoints = DATA.points.filter(point => point.model === model);

      for (const tick of tickValues()) {
        const x = xScale(tick);
        svg.appendChild(makeSvg('line', { x1: x, y1: margin.top, x2: x, y2: height - margin.bottom, class: 'grid-line' }));
        const label = makeSvg('text', { x, y: height - margin.bottom + 34, 'text-anchor': 'middle', class: 'tick-label' });
        label.textContent = tick.toFixed(2);
        svg.appendChild(label);
      }

      for (const strategy of strategies) {
        const y = yScale(strategy);
        const label = makeSvg('text', { x: margin.left - 24, y: y + 7, 'text-anchor': 'end', class: 'tick-label' });
        label.textContent = DATA.strategyLabels[strategy];
        svg.appendChild(label);
      }

      svg.appendChild(makeSvg('line', { x1: margin.left, y1: height - margin.bottom, x2: width - margin.right, y2: height - margin.bottom, class: 'axis-line' }));
      svg.appendChild(makeSvg('line', { x1: margin.left, y1: margin.top, x2: margin.left, y2: height - margin.bottom, class: 'axis-line' }));

      const xLabel = makeSvg('text', { x: margin.left + plotWidth / 2, y: height - margin.bottom + 94, 'text-anchor': 'middle', class: 'axis-label' });
      xLabel.textContent = 'Mean semantic similarity';
      svg.appendChild(xLabel);

      const bySample = new Map();
      for (const point of modelPoints) {
        if (!bySample.has(point.sampleKey)) bySample.set(point.sampleKey, []);
        bySample.get(point.sampleKey).push(point);
      }

      for (const point of modelPoints) {
        const offset = point.correct ? -0.12 : 0.12;
        point._x = xScale(point.score);
        point._y = yScale(point.strategy + offset) + point.pngStyleJitter;
      }

      const violinLayer = makeSvg('g');
      const lineLayer = makeSvg('g');
      const pointLayer = makeSvg('g');
      const hoverLayer = makeSvg('g');
      svg.append(violinLayer, lineLayer, pointLayer, hoverLayer);

      for (const strategy of strategies) {
        for (const correct of [true, false]) {
          const offset = correct ? -0.12 : 0.12;
          const group = modelPoints.filter(point => point.strategy === strategy && point.correct === correct);
          if (!group.length) continue;
          const density = buildDensity(group.map(point => point.score), xMin, xMax);
          const centerY = yScale(strategy + offset);
          const upper = density.map(item => [xScale(item.x), centerY - item.width]);
          const lower = [...density].reverse().map(item => [xScale(item.x), centerY + item.width]);
          const pathData = [...upper, ...lower].map((item, index) => `${index ? 'L' : 'M'} ${item[0]} ${item[1]}`).join(' ') + ' Z';
          violinLayer.appendChild(makeSvg('path', {
            d: pathData,
            class: 'violin',
            fill: correct ? colors.correct : colors.incorrect,
            stroke: correct ? colors.correct : colors.incorrect,
          }));
          const med = mean(group.map(point => point.score));
          const medX = xScale(med);
          violinLayer.appendChild(makeSvg('line', {
            x1: medX,
            y1: centerY - 28,
            x2: medX,
            y2: centerY + 28,
            class: 'median',
          }));
        }
      }

      for (const [key, samplePoints] of bySample.entries()) {
        const related = samplePoints.sort((a, b) => a.strategy - b.strategy);
        for (let i = 0; i < related.length - 1; i++) {
          const start = related[i];
          const end = related[i + 1];
          const segmentClass = classifySegment(start, end);
          const line = makeSvg('line', {
            x1: start._x,
            y1: start._y,
            x2: end._x,
            y2: end._y,
            class: `sample-line ${segmentClass}`,
            'data-sample-key': key,
          });
          lineLayer.appendChild(line);
        }
      }

      for (const point of modelPoints) {
        const circle = makeSvg('circle', {
          cx: point._x,
          cy: point._y,
          r: 5.2,
          class: `point ${point.correct ? 'correct' : 'incorrect'}`,
          tabindex: 0,
          'data-sample-key': point.sampleKey,
        });
        circle.__point = point;
        circle.addEventListener('mouseenter', event => activatePoint(point, pointLayer, lineLayer, hoverLayer, event));
        circle.addEventListener('mousemove', event => moveTooltip(event));
        circle.addEventListener('mouseleave', () => clearHover(pointLayer, lineLayer, hoverLayer));
        circle.addEventListener('click', () => window.open(point.detailUrl, '_blank'));
        circle.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') window.open(point.detailUrl, '_blank');
        });
        pointLayer.appendChild(circle);
      }
    }

    function activatePoint(point, pointLayer, lineLayer, hoverLayer, event) {
      hoverLayer.replaceChildren();
      for (const circle of pointLayer.querySelectorAll('.point')) {
        const isRelated = circle.getAttribute('data-sample-key') === point.sampleKey;
        circle.classList.toggle('dimmed', !isRelated);
        circle.classList.toggle('active', isRelated);
      }
      for (const line of lineLayer.querySelectorAll('.sample-line')) {
        const isRelated = line.getAttribute('data-sample-key') === point.sampleKey;
        line.classList.toggle('dimmed', !isRelated);
        line.classList.toggle('active', isRelated);
      }
      const label = makeSvg('text', { x: point._x + 9, y: point._y - 11, class: 'hover-label' });
      label.textContent = point.sampleKey;
      hoverLayer.appendChild(label);
      tooltip.innerHTML = `
        <strong>${point.model} | ${point.sampleKey}</strong><br>
        Molecule ID: ${point.moleculeId}<br>
        Experiment ID: ${point.experimentId}<br>
        ${DATA.strategyLabels[point.strategy]}<br>
        Score: ${point.score.toFixed(4)}<br>
        ${point.correct ? 'Correct prediction' : 'Wrong prediction'}
      `;
      tooltip.style.display = 'block';
      moveTooltip(event);
    }

    function moveTooltip(event) {
      tooltip.style.left = `${event.clientX + 14}px`;
      tooltip.style.top = `${event.clientY + 14}px`;
    }

    function clearHover(pointLayer, lineLayer, hoverLayer) {
      hoverLayer.replaceChildren();
      for (const circle of pointLayer.querySelectorAll('.point')) circle.classList.remove('dimmed', 'active');
      for (const line of lineLayer.querySelectorAll('.sample-line')) line.classList.remove('dimmed', 'active');
      tooltip.style.display = 'none';
    }

    for (const model of DATA.models) renderChart(model);
  </script>
